<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Candidatos | SIMAN SmartRecruit</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/candidatos.css"></head><body><div id="sidebarContainer"></div><main class="main-content"><div class="page-header"><div><h1><i class="fas fa-users"></i> Candidatos</h1><p class="text-muted">Pipeline conectado a Supabase</p></div><button class="btn btn-primary" id="btnNuevoCandidato"><i class="fas fa-user-plus"></i> Nuevo candidato</button></div><section class="card candidatos-toolbar"><input id="buscarCandidato" type="search" placeholder="Buscar candidato"><select id="filtroEstado"><option value="">Todos los estados</option><option>Nuevo</option><option>Preselección</option><option>Entrevista RH</option><option>Entrevista</option><option>Evaluación</option><option>Oferta</option><option>Contratado</option><option>Descartado</option></select><span id="contadorCandidatos" class="badge">0 candidatos</span></section><section class="card"><div class="table-responsive"><table class="data-table"><thead><tr><th>Nombre</th><th>Vacante</th><th>Contacto</th><th>Estado</th><th>Fuente</th><th>Creado</th></tr></thead><tbody id="candidatosBody"><tr><td colspan="6">Cargando...</td></tr></tbody></table></div></section></main><div class="modal-overlay" id="modalCandidato" hidden><div class="modal-card"><div class="modal-header"><h2>Nuevo candidato</h2><button type="button" class="modal-close" id="cerrarModalCandidato">&times;</button></div><form id="formCandidato"><div class="form-grid"><label>Nombre<input id="candNombre" required></label><label>Correo<input id="candEmail" type="email"></label><label>Teléfono<input id="candTelefono"></label><label>Fuente<input id="candFuente"></label><label>Vacante<select id="candRequisicion"><option value="">Sin asignar</option></select></label><label>Estado<select id="candEstado"><option>Nuevo</option><option>Preselección</option><option>Entrevista RH</option><option>Entrevista</option><option>Evaluación</option><option>Oferta</option><option>Contratado</option><option>Descartado</option></select></label><label>Pretensión salarial<input id="candSalario" type="number" min="0" step=".01"></label><label>Entrevista<input id="candEntrevista" type="datetime-local"></label></div><label>Notas<textarea id="candNotas" rows="4"></textarea></label><div class="modal-actions"><button type="button" class="btn" id="cancelarCandidato">Cancelar</button><button type="submit" class="btn btn-primary" id="guardarCandidato">Guardar</button></div></form></div></div><script src="js/supabase-client.js"></script><script src="js/auth.js"></script><script src="js/router.js"></script><script src="js/sidebar.js"></script><script src="js/darkmode.js"></script><script src="js/candidatos.js"></script></body></html>
