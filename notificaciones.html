<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIMAN SmartRecruit - Centro de Notificaciones</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/notificaciones.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
<div id="sidebar-container"></div>
<div class="main-content">
  <div id="topbar-container"></div>
  <main class="notifications-page">
    <section class="notifications-hero">
      <div>
        <span class="eyebrow"><i class="fas fa-bell"></i> SmartRecruit</span>
        <h1>Centro de Notificaciones</h1>
        <p>Eventos y avisos de tu proceso de reclutamiento.</p>
      </div>
      <div class="hero-actions">
        <span id="badgeNoLeidas" class="unread-counter">0 no leídas</span>
        <button id="btnMarcarTodas" class="btn-notification secondary" type="button">
          <i class="fas fa-check-double"></i> Marcar todas como leídas
        </button>
      </div>
    </section>

    <section class="notifications-panel">
      <div class="notifications-toolbar">
        <div class="filter-buttons">
          <button type="button" class="filter-btn active" data-filter="todas">Todas</button>
          <button type="button" class="filter-btn" data-filter="no-leidas">No leídas</button>
        </div>
        <button type="button" id="btnActualizar" class="btn-notification ghost">
          <i class="fas fa-rotate"></i> Actualizar
        </button>
      </div>

      <div id="notificacionesContainer" class="notifications-timeline" aria-live="polite">
        <div class="empty-state"><i class="fas fa-spinner fa-spin"></i><span>Cargando notificaciones...</span></div>
      </div>
    </section>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/router.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/darkmode.js"></script>
<script src="js/notifications.js"></script>
<script src="js/notificaciones.js"></script>
</body>
</html>
