<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIMAN SmartRecruit - Vacantes</title>
    <link rel="stylesheet" href="css/global.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        .vacante-card {
            transition: all 0.2s;
        }
        .vacante-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }
    </style>
</head>
<body>
    <div id="sidebar-container"></div>
    
    <div class="main-content">
        <div id="topbar-container"></div>
        
        <div class="card">
            <div class="card-header">
                <span><i class="fas fa-briefcase"></i> Vacantes Disponibles</span>
                <div>
                    <span class="badge badge-blue" id="totalVacantes">0 activas</span>
                    <button class="btn btn-outline" onclick="cargarVacantes()" style="padding:4px 12px; margin-left:8px;">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
            </div>
            
            <div id="vacantesContainer" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap:16px;">
                <div class="empty-state">
                    <i class="fas fa-briefcase"></i>
                    No hay vacantes disponibles
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/auth.js"></script>
    <script src="js/router.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/darkmode.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/configuracion.js"></script>
    <script src="js/vacantes.js"></script>
</body>
</html>
