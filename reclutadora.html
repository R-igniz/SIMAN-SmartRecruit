<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIMAN SmartRecruit - Panel Reclutadora</title>
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/reclutadora.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        .requisicion-card {
            transition: all 0.2s ease;
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 16px 20px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
        }
        .requisicion-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
        }
        .requisicion-card .card-header-custom {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }
        .requisicion-card .card-title {
            font-weight: 600;
            font-size: 16px;
            color: var(--text-secondary);
        }
        .requisicion-card .card-subtitle {
            font-size: 13px;
            color: var(--text-muted);
        }
        .requisicion-card .card-meta {
            display: flex;
            gap: 12px;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 6px;
            flex-wrap: wrap;
        }
        .requisicion-card .card-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        .requisicion-card .card-actions .btn {
            flex: 1;
            justify-content: center;
            padding: 6px 12px;
            font-size: 12px;
        }
        .filter-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            padding: 16px;
            background: var(--bg-body);
            border-radius: var(--radius);
            margin-bottom: 16px;
        }
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .filter-group label {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .filter-group select,
        .filter-group input {
            padding: 8px 12px;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 0.85rem;
            font-family: var(--font);
        }
        .filter-group select:focus,
        .filter-group input:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(0, 86, 166, 0.1);
        }
        .filter-actions {
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }
        .empty-state i {
            font-size: 48px;
            margin-bottom: 12px;
            display: block;
        }
        @media (max-width: 480px) {
            .filter-bar {
                grid-template-columns: 1fr 1fr;
            }
            .filter-actions {
                grid-column: 1 / -1;
                flex-direction: row;
            }
            .requisicion-card .card-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div id="sidebar-container"></div>
    
    <div class="main-content">
        <div id="topbar-container"></div>
        
        <div class="card">
            <div class="card-header">
                <span><i class="fas fa-user-tie"></i> Panel de Reclutadora</span>
                <span class="badge badge-blue" id="totalRequisiciones">0 requisiciones</span>
            </div>
            
            <div class="filter-bar" id="filterBar">
                <div class="filter-group">
                    <label>Centro Comercial</label>
                    <select id="filtroCentro" onchange="aplicarFiltros()">
                        <option value="">Todos</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Estado</label>
                    <select id="filtroEstado" onchange="aplicarFiltros()">
                        <option value="">Todos</option>
                        <option value="Nueva">Nueva</option>
                        <option value="Revisando">Revisando</option>
                        <option value="Publicada">Publicada</option>
                        <option value="En Proceso">En Proceso</option>
                        <option value="Entrevistas">Entrevistas</option>
                        <option value="Urgente">Urgente</option>
                        <option value="Cerrado">Cerrado</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Prioridad</label>
                    <select id="filtroPrioridad" onchange="aplicarFiltros()">
                        <option value="">Todas</option>
                        <option value="Alta">Alta</option>
                        <option value="Media">Media</option>
                        <option value="Baja">Baja</option>
                    </select>
                </div>
                <div class="filter-actions">
                    <button class="btn btn-primary" onclick="aplicarFiltros()" style="padding:6px 16px;">
                        <i class="fas fa-search"></i> Buscar
                    </button>
                    <button class="btn btn-outline" onclick="limpiarFiltros()" style="padding:6px 16px;">
                        <i class="fas fa-undo"></i> Limpiar
                    </button>
                </div>
            </div>
            
            <div id="requisicionesContainer" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap:16px; margin-top:16px;">
                <div class="empty-state">
                    <i class="fas fa-inbox"></i>
                    No hay requisiciones asignadas
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts: auth, router, sidebar, darkmode, notifications, supabase, configuracion, reclutadora -->
    <script src="js/auth.js"></script>
    <script src="js/router.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/darkmode.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/configuracion.js"></script>
</body>
</html>
