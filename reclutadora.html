<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIMAN SmartRecruit - Panel Reclutadora</title>
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/reclutadora.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body>
    <div id="sidebar-container"></div>
    
    <div class="main-content">
        <div id="topbar-container"></div>
        
        <div class="card">
            <div class="card-header">
                <span><i class="fas fa-user-tie"></i> Panel de Reclutadora</span>
                <span class="badge badge-blue" id="totalRequisiciones">0 requisiciones</span>
            </div>
            
            <!-- Filtros -->
            <div class="filter-bar">
                <div class="filter-group">
                    <label>Centro Comercial</label>
                    <select id="filtroCentro" onchange="aplicarFiltros()">
                        <option value="">Todos</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Estado</label>
                    <select id="filtroEstado" onchange="aplicarFiltros()">
                        <option value="">Todos</option>
                        <option value="Nueva">Nueva</option>
                        <option value="Revisando">Revisando</option>
                        <option value="Publicada">Publicada</option>
                        <option value="En Proceso">En Proceso</option>
                        <option value="Entrevistas">Entrevistas</option>
                        <option value="Urgente">Urgente</option>
                        <option value="Cerrado">Cerrado</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Prioridad</label>
                    <select id="filtroPrioridad" onchange="aplicarFiltros()">
                        <option value="">Todas</option>
                        <option value="Alta">Alta</option>
                        <option value="Media">Media</option>
                        <option value="Baja">Baja</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>&nbsp;</label>
                    <button class="btn btn-outline" onclick="aplicarFiltros()" style="padding:6px 16px;">
                        <i class="fas fa-search"></i> Buscar
                    </button>
                    <button class="btn btn-outline" onclick="limpiarFiltros()" style="padding:6px 16px;">
                        <i class="fas fa-undo"></i> Limpiar
                    </button>
                </div>
            </div>
            
            <!-- Lista de requisiciones -->
            <div id="requisicionesContainer" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap:16px; margin-top:16px;">
                <div class="empty-state">
                    <i class="fas fa-inbox"></i>
                    No hay requisiciones asignadas
                </div>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/router.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/darkmode.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/configuracion.js"></script>
    <script src="js/reclutadora.js"></script>
</body>
</html>
