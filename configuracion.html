<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIMAN SmartRecruit - Configuración</title>
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/configuracion.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body>
    <div id="sidebar-container"></div>
    
    <div class="main-content">
        <div id="topbar-container"></div>
        
        <!-- Botones de acción -->
        <div class="config-actions" style="display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap;">
            <button class="btn btn-primary" onclick="abrirGestion('usuarios')">
                <i class="fas fa-users"></i> Usuarios
            </button>
            <button class="btn btn-primary" onclick="abrirGestion('roles')">
                <i class="fas fa-user-tag"></i> Roles
            </button>
            <button class="btn btn-primary" onclick="abrirGestion('comerciales')">
                <i class="fas fa-store"></i> Comerciales
            </button>
            <button class="btn btn-primary" onclick="abrirGestion('tiendas')">
                <i class="fas fa-shopping-bag"></i> Tiendas
            </button>
            <button class="btn btn-primary" onclick="abrirGestion('departamentos')">
                <i class="fas fa-building"></i> Departamentos
            </button>
            <button class="btn btn-primary" onclick="abrirGestion('estados')">
                <i class="fas fa-circle"></i> Estados
            </button>
            <button class="btn btn-primary" onclick="abrirGestion('prioridades')">
                <i class="fas fa-flag"></i> Prioridades
            </button>
            <button class="btn btn-primary" onclick="abrirGestion('motivos')">
                <i class="fas fa-question-circle"></i> Motivos
            </button>
            <button class="btn btn-primary" onclick="abrirGestion('tiposContratacion')">
                <i class="fas fa-file-signature"></i> Tipos Contratación
            </button>
            <button class="btn btn-primary" onclick="abrirGestion('asignaciones')">
                <i class="fas fa-robot"></i> Asignaciones
            </button>
            <button class="btn btn-primary" onclick="abrirGestion('correos')">
                <i class="fas fa-envelope"></i> Correos
            </button>
            <button class="btn btn-primary" onclick="abrirGestion('plantillas')">
                <i class="fas fa-file-alt"></i> Plantillas
            </button>
            <button class="btn btn-primary" onclick="abrirGestion('cartasOferta')">
                <i class="fas fa-file-signature"></i> Cartas Oferta
            </button>
            
            <!-- Botones de sincronización -->
            <button class="btn btn-success" onclick="ejecutarSincronizacion()" style="background:#2b8c4a; color:white;">
                <i class="fas fa-cloud-upload-alt"></i> Subir a nube
            </button>
            <button class="btn btn-primary" onclick="ejecutarCargaNube()" style="background:#0056A6; color:white;">
                <i class="fas fa-cloud-download-alt"></i> Bajar de nube
            </button>
            
            <button class="btn btn-outline" onclick="exportarDatos()">
                <i class="fas fa-download"></i> Exportar
            </button>
            <button class="btn btn-danger" onclick="limpiarDatos()" style="background:#b33c3c; color:white;">
                <i class="fas fa-trash-alt"></i> Limpiar
            </button>
        </div>
        
        <!-- Panel de Gestión -->
        <div class="config-section" id="gestionPanel" style="display:none;">
            <div class="config-header">
                <h2 id="gestionTitulo"><i class="fas fa-list"></i> Gestión</h2>
                <button class="btn btn-primary" onclick="abrirModalAgregar()">
                    <i class="fas fa-plus"></i> Agregar
                </button>
            </div>
            
            <div class="table-container">
                <table class="modern-table" id="gestionTabla">
                    <thead id="gestionThead"></thead>
                    <tbody id="gestionBody"></tbody>
                </table>
            </div>
        </div>
    </div>
    
    <!-- MODAL: Agregar/Editar -->
    <div class="modal-overlay" id="modalGestion">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="modalGestionTitulo"><i class="fas fa-plus"></i> Agregar</h3>
                <button class="modal-close" onclick="cerrarModal('modalGestion')">&times;</button>
            </div>
            <div class="modal-body">
                <form id="formGestion" onsubmit="guardarItem(event)">
                    <input type="hidden" id="gestionId" value="" />
                    <input type="hidden" id="gestionTipo" value="" />
                    
                    <div class="form-group" id="campoNombre">
                        <label id="labelNombre">Nombre</label>
                        <input type="text" id="gestionNombre" placeholder="Ingrese el nombre" required />
                    </div>
                    
                    <!-- Campo específico para tiendas (asignar a comercial) -->
                    <div id="campoComercial" style="display:none;">
                        <div class="form-group">
                            <label>Centro Comercial</label>
                            <select id="tiendaComercial">
                                <option value="">Seleccionar centro...</option>
                            </select>
                        </div>
                    </div>
                    
                    <!-- Campos para usuarios -->
                    <div id="camposUsuario" style="display:none;">
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="usuarioEmail" placeholder="usuario@siman.com" />
                        </div>
                        <div class="form-group">
                            <label>Contraseña</label>
                            <input type="password" id="usuarioPassword" placeholder="Mínimo 6 caracteres" />
                        </div>
                        <div class="form-group">
                            <label>Rol</label>
                            <select id="usuarioRol">
                                <option value="">Seleccionar rol...</option>
                            </select>
                        </div>
                    </div>
                    
                    <!-- Campos para cartas oferta -->
                    <div id="camposCarta" style="display:none;">
                        <div class="form-group">
                            <label>Monto ($)</label>
                            <input type="number" id="cartaMonto" placeholder="1500" step="0.01" />
                        </div>
                        <div class="form-group">
                            <label>Archivo (PDF)</label>
                            <input type="file" id="cartaArchivo" accept=".pdf" />
                            <small style="color:#5f6b7a;">Opcional: sube un archivo PDF</small>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Estado</label>
                        <select id="gestionEstado">
                            <option value="activo">Activo</option>
                            <option value="inactivo">Inactivo</option>
                        </select>
                    </div>
                    
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline" onclick="cerrarModal('modalGestion')">Cancelar</button>
                        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <!-- MODAL: Confirmación -->
    <div class="modal-overlay" id="modalConfirmacion">
        <div class="modal-box" style="max-width:400px; text-align:center;">
            <div style="font-size:48px; color:var(--success); margin-bottom:16px;">
                <i class="fas fa-check-circle"></i>
            </div>
            <h3 id="confirmacionTitulo" style="margin-bottom:8px;">¡Completado!</h3>
            <p id="confirmacionMensaje" style="color:#5f6b7a; margin-bottom:20px;">Operación realizada correctamente.</p>
            <button class="btn btn-primary" onclick="cerrarModal('modalConfirmacion')">Aceptar</button>
        </div>
    </div>
    
<script src="js/auth.js"></script>
<script src="js/router.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/darkmode.js"></script>
<script src="js/notifications.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/configuracion.js"></script>
</body>
</html>
