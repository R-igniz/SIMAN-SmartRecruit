<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIMAN SmartRecruit - Perfil</title>
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/perfil.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body>
    <div id="sidebar-container"></div>
    
    <div class="main-content">
        <div id="topbar-container"></div>
        
        <div class="profile-grid">
            <!-- Perfil -->
            <div class="card profile-card">
                <div class="profile-header">
                    <div class="profile-avatar-large">U</div>
                    <div>
                        <h2 id="profileName">Usuario</h2>
                        <p id="profileRole">Cargando...</p>
                        <p id="profileStore"><i class="fas fa-store"></i> Cargando...</p>
                    </div>
                </div>
                
                <div class="profile-info">
                    <div class="info-row">
                        <span class="info-label">Email</span>
                        <span class="info-value" id="profileEmail">-</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Rol</span>
                        <span class="info-value" id="profileRoleDetail">-</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Centro Comercial</span>
                        <span class="info-value" id="profileStoreDetail">-</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Permisos</span>
                        <span class="info-value" id="profilePermisos">
                            <span class="badge badge-blue">Cargando...</span>
                        </span>
                    </div>
                </div>
            </div>
            
            <!-- Configuración -->
            <div class="card">
                <div class="card-header">
                    <span><i class="fas fa-sliders-h"></i> Configuración</span>
                </div>
                
                <div class="settings-list">
                    <div class="setting-item">
                        <span><i class="fas fa-moon"></i> Modo oscuro</span>
                        <label class="switch">
                            <input type="checkbox" id="darkModeToggle" />
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="setting-item">
                        <span><i class="fas fa-language"></i> Idioma</span>
                        <select id="languageSelect">
                            <option value="es">Español</option>
                            <option value="en">English</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <!-- Seguridad -->
            <div class="card">
                <div class="card-header">
                    <span><i class="fas fa-shield-alt"></i> Seguridad</span>
                </div>
                
                <div class="settings-list">
                    <div class="setting-item">
                        <span><i class="fas fa-key"></i> Cambiar contraseña</span>
                        <button class="btn btn-outline" style="padding:6px 16px;" onclick="cambiarContrasena()">Cambiar</button>
                    </div>
                    <div class="setting-item">
                        <span><i class="fas fa-mobile-alt"></i> Autenticación 2FA</span>
                        <label class="switch">
                            <input type="checkbox" />
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="js/auth.js"></script>
    <script src="js/router.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/darkmode.js"></script>
    <script src="js/perfil.js"></script>
</body>
</html>
