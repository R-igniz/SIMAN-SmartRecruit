<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIMAN SmartRecruit - Mis Requisiciones</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/requisicion.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body>
  <div id="sidebar-container"></div>
  
  <div class="main-content">
    <div id="topbar-container"></div>
    
    <div class="card">
      <div class="card-header">
        <span><i class="fas fa-list-ul"></i> Mis Requisiciones</span>
        <button class="btn btn-primary" onclick="navigateTo('/nueva-requisicion.html')">
          <i class="fas fa-plus"></i> Nueva Requisición
        </button>
      </div>
      
      <div class="table-container">
        <table class="modern-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Puesto</th>
              <th>Centro Comercial</th>
              <th>Estado</th>
              <th>Fecha</th>
              <th style="text-align:center;">Acciones</th>
            </tr>
          </thead>
          <tbody id="requisicionesBody">
            <tr>
              <td colspan="6" class="empty-state">
                <i class="fas fa-inbox"></i>
                No hay requisiciones registradas
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/router.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/requisiciones.js"></script>
  <script src="js/darkmode.js"></script>
</body>
</html>
