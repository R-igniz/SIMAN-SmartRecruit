<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>SIMAN SmartRecruit - Usuarios</title><link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/usuarios.css"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet"></head><body>
<div id="sidebar-container"></div><div class="main-content"><div id="topbar-container"></div>
<section class="users-card"><header class="users-head"><div><h2><i class="fas fa-users"></i> Usuarios del Sistema</h2><p>Administración de perfiles, roles y acceso</p></div><button id="btnNuevo" class="btn-main"><i class="fas fa-user-plus"></i> Nuevo usuario</button></header>
<div class="table-container"><table class="modern-table"><thead><tr><th>Nombre</th><th>Email</th><th>Rol</th><th>Estado</th><th>Cambio clave</th><th>Acciones</th></tr></thead><tbody id="usuariosBody"><tr><td colspan="6" class="empty-state">Cargando...</td></tr></tbody></table></div></section></div>
<div id="modalUsuario" class="modal-u"><div class="modal-box"><button class="close-u" data-close>&times;</button><h3 id="modalTitulo">Nuevo usuario</h3><form id="formUsuario"><input id="usuarioId" type="hidden"><label>Nombre<input id="usuarioNombre" required maxlength="120"></label><label>Email<input id="usuarioEmail" type="email" required></label><label>Rol<select id="usuarioRol" required><option value="admin">Administrador</option><option value="gerente_rh">Gerente RH</option><option value="reclutadora">Reclutadora</option><option value="ejecutivo">Ejecutivo</option></select></label><label id="wrapActivo">Estado<select id="usuarioActivo"><option value="true">Activo</option><option value="false">Inactivo</option></select></label><label id="wrapTemp">Contraseña temporal<input id="usuarioPassword" type="password" minlength="8" autocomplete="new-password"></label><div class="modal-actions"><button type="button" class="btn-light" data-close>Cancelar</button><button class="btn-main" type="submit">Guardar</button></div></form></div></div>
<div id="modalPassword" class="modal-u"><div class="modal-box"><button class="close-u" data-close>&times;</button><h3>Restablecer contraseña</h3><p id="passwordUsuario"></p><form id="formPassword"><input id="passwordUserId" type="hidden"><label>Contraseña temporal<input id="passwordTemporal" type="password" minlength="8" required autocomplete="new-password"></label><p class="hint">El usuario deberá cambiarla al iniciar sesión.</p><div class="modal-actions"><button type="button" class="btn-light" data-close>Cancelar</button><button class="btn-main" type="submit">Restablecer</button></div></form></div></div>
<script src="js/auth.js"></script><script src="js/router.js"></script><script src="js/sidebar.js"></script><script src="js/darkmode.js"></script><script src="js/notifications.js"></script><script src="js/supabase-client.js"></script><script src="js/usuarios.js"></script></body></html>
