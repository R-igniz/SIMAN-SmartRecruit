<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Seguimiento | SIMAN SmartRecruit</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/seguimiento.css">
</head>

<body>

<div class="app-layout">

    <!-- SIDEBAR -->
    <aside id="sidebar-container"></aside>

    <!-- CONTENIDO -->
    <main class="main-content">

        <!-- TOPBAR -->
        <div id="topbar-container"></div>

        <section class="page-content">

            <div class="page-header">
                <div>
                    <h1>
                        <i class="fa-solid fa-chart-line"></i>
                        Seguimiento
                    </h1>

                    <p>
                        Seguimiento en tiempo real de los procesos de reclutamiento.
                    </p>
                </div>
            </div>

            <div class="panel">

                <div class="panel-header">

                    <div class="panel-title">
                        <i class="fa-solid fa-list-check"></i>
                        <span>Seguimiento de Procesos</span>
                    </div>

                    <span id="contadorProcesos" class="badge">
                        0 ACTIVOS
                    </span>

                </div>

                <!-- IMPORTANTE:
                     seguimiento.js insertará aquí las requisiciones -->
                <div id="seguimientoContainer">

                    <div class="loading-state">
                        <i class="fa-solid fa-spinner fa-spin"></i>
                        <p>Cargando procesos...</p>
                    </div>

                </div>

            </div>

        </section>

    </main>

</div>


<!-- ============================= -->
<!-- LIBRERÍAS -->
<!-- ============================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<!-- ============================= -->
<!-- SISTEMA -->
<!-- ============================= -->

<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/darkmode.js"></script>


<!-- ============================= -->
<!-- MÓDULO -->
<!-- ============================= -->

<script src="js/seguimiento.js"></script>

</body>
</html>
