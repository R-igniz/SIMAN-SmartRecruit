<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Seguimiento | SIMAN SmartRecruit
    </title>

    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >

    <!-- =====================================================
         ESTILOS DEL SISTEMA
    ====================================================== -->
    <link
        rel="stylesheet"
        href="css/styles.css"
    >

</head>


<body>

    <!-- =====================================================
         SIDEBAR
         Se genera desde auth.js / componentes del sistema
    ====================================================== -->

    <div
        id="sidebar-container"
    ></div>


    <!-- =====================================================
         CONTENIDO PRINCIPAL
    ====================================================== -->

    <main class="main-content">

        <!-- =================================================
             HEADER
        ================================================== -->

        <div class="page-header">

            <div>

                <h1>
                    <i class="fas fa-chart-line"></i>
                    Seguimiento
                </h1>

                <p class="text-muted">
                    Seguimiento en tiempo real de los procesos
                    de reclutamiento.
                </p>

            </div>

        </div>


        <!-- =================================================
             TARJETA PRINCIPAL
        ================================================== -->

        <div class="card">

            <!-- =============================================
                 ENCABEZADO
            ============================================== -->

            <div class="card-header">

                <span>

                    <i class="fas fa-tasks"></i>

                    Seguimiento de Procesos

                </span>


                <!--
                    IMPORTANTE:
                    Este contador ya NO es estático.

                    seguimiento.js actualizará:
                    0 activos
                    1 activo
                    2 activos
                    etc.
                -->

                <span
                    id="seguimientoContador"
                    class="badge badge-blue"
                >
                    0 activos
                </span>

            </div>


            <!-- =============================================
                 CONTENEDOR DINÁMICO

                 seguimiento.js Fase 3 insertará aquí las
                 requisiciones obtenidas desde Supabase.
            ============================================== -->

            <div
                id="seguimientoContainer"
                style="
                    display:flex;
                    flex-direction:column;
                    gap:16px;
                "
            >

                <!-- =========================================
                     ESTADO INICIAL
                ========================================== -->

                <div
                    style="
                        padding:40px 20px;
                        text-align:center;
                        color:var(--text-muted);
                    "
                >

                    <div
                        style="
                            margin-bottom:12px;
                            font-size:26px;
                        "
                    >

                        <i
                            class="fas fa-spinner fa-spin"
                        ></i>

                    </div>


                    <div>
                        Cargando procesos desde Supabase...
                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- =====================================================
         SCRIPTS

         IMPORTANTE:
         mantener este orden.
    ====================================================== -->


    <!-- Supabase SDK -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- Cliente Supabase Fase 3 -->

    <script
        src="js/supabase-client.js"
    ></script>


    <!-- Autenticación / Roles / Sidebar -->

    <script
        src="js/auth.js"
    ></script>


    <!-- Modo oscuro -->

    <script
        src="js/darkmode.js"
    ></script>


    <!-- Seguimiento Fase 3 -->

    <script
        src="js/seguimiento.js"
    ></script>


</body>

</html>
