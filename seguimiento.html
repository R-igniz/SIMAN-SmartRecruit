<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SIMAN SmartRecruit - Seguimiento</title>

    <!-- ==========================================
         ESTILOS GLOBALES
    =========================================== -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/seguimiento.css">

    <!-- Fuente -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    >
</head>

<body>

    <!-- ==========================================
         SIDEBAR GLOBAL
    =========================================== -->
    <div id="sidebar-container"></div>


    <!-- ==========================================
         CONTENIDO PRINCIPAL
    =========================================== -->
    <div class="main-content">

        <!-- TOPBAR GLOBAL -->
        <div id="topbar-container"></div>


        <!-- ======================================
             CONTENIDO DEL MÓDULO
        ======================================= -->
        <div class="page-content seguimiento-page">

            <!-- ENCABEZADO -->
            <div class="page-header">

                <div>
                    <h1>
                        <i class="fas fa-chart-line"></i>
                        Seguimiento
                    </h1>

                    <p>
                        Seguimiento en tiempo real de los procesos de reclutamiento.
                    </p>
                </div>

            </div>


            <!-- ==================================
                 PANEL PRINCIPAL
            =================================== -->
            <div class="card seguimiento-panel">

                <div class="card-header">

                    <div class="card-title">
                        <i class="fas fa-tasks"></i>
                        <span>Seguimiento de Procesos</span>
                    </div>

                    <span
                        class="badge badge-blue"
                        id="contadorProcesos"
                    >
                        0 ACTIVOS
                    </span>

                </div>


                <!-- ==================================
                     CONTENEDOR DINÁMICO
                     seguimiento.js renderiza aquí
                =================================== -->
                <div id="seguimientoContainer">

                    <div class="seguimiento-loading">

                        <i class="fas fa-spinner fa-spin"></i>

                        <span>
                            Cargando procesos...
                        </span>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- ==========================================
         SUPABASE
    =========================================== -->
    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>


    <!-- ==========================================
         CORE DEL SISTEMA
         IMPORTANTE: MANTENER ESTE ORDEN
    =========================================== -->

    <script src="js/supabase-client.js"></script>

    <script src="js/auth.js"></script>

    <script src="js/router.js"></script>

    <script src="js/sidebar.js"></script>

    <script src="js/darkmode.js"></script>

    <script src="js/notifications.js"></script>


    <!-- ==========================================
         MÓDULO SEGUIMIENTO
    =========================================== -->
    <script src="js/seguimiento.js"></script>

</body>
</html>
