<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SIMAN SmartRecruit - Seguimiento</title>

    <!-- CSS PRINCIPAL -->
    <link
        rel="stylesheet"
        href="css/global.css"
    >

    <!-- FUENTE INTER -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap"
        rel="stylesheet"
    >

    <!-- FONT AWESOME -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    >
</head>


<body>

    <!-- =====================================================
         CONTENIDO PRINCIPAL
    ====================================================== -->

    <main class="main-content">

        <!-- =================================================
             ENCABEZADO
        ================================================== -->

        <div class="page-header">

            <div>
                <h1>
                    <i class="fas fa-chart-line"></i>
                    Seguimiento
                </h1>

                <p class="text-muted">
                    Seguimiento en tiempo real de los procesos de reclutamiento.
                </p>
            </div>

        </div>


        <!-- =================================================
             TARJETA PRINCIPAL
        ================================================== -->

        <div class="card">

            <div class="card-header">

                <span>
                    <i class="fas fa-tasks"></i>
                    Seguimiento de Procesos
                </span>

                <!-- CONTADOR DINÁMICO -->
                <span
                    id="seguimientoContador"
                    class="badge badge-blue"
                >
                    0 activos
                </span>

            </div>


            <!-- =================================================
                 AQUÍ seguimiento.js INSERTA LOS DATOS DE SUPABASE
            ================================================== -->

            <div
                id="seguimientoContainer"
                style="
                    display:flex;
                    flex-direction:column;
                    gap:16px;
                "
            >

                <div
                    style="
                        padding:40px 20px;
                        text-align:center;
                        color:var(--text-muted);
                    "
                >

                    <i
                        class="fas fa-spinner fa-spin"
                        style="
                            font-size:24px;
                            margin-bottom:12px;
                        "
                    ></i>

                    <div>
                        Cargando procesos desde Supabase...
                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- =====================================================
         JAVASCRIPT
         IMPORTANTE: CONSERVAR ESTE ORDEN
    ====================================================== -->

    <!-- SUPABASE SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- CLIENTE SUPABASE -->
    <script src="js/supabase-client.js"></script>

    <!-- AUTENTICACIÓN / SIDEBAR / PERMISOS -->
    <script src="js/auth.js"></script>

    <!-- MODO OSCURO -->
    <script src="js/darkmode.js"></script>

    <!-- SEGUIMIENTO -->
    <script src="js/seguimiento.js"></script>

</body>

</html>
