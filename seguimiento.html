<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Seguimiento | SIMAN SmartRecruit
    </title>


    <!-- =====================================================
         FUENTE
    ====================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         ICONOS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- =====================================================
         ESTILOS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="css/global.css"
    >

    <link
        rel="stylesheet"
        href="css/seguimiento.css"
    >

</head>


<body>


<!-- =========================================================
     APP
========================================================== -->

<div class="app-layout">


    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <aside id="sidebar-container"></aside>


    <!-- =====================================================
         CONTENIDO PRINCIPAL
    ====================================================== -->

    <main class="main-content">


        <!-- =================================================
             TOPBAR
        ================================================== -->

        <div id="topbar-container"></div>


        <!-- =================================================
             PÁGINA
        ================================================== -->

        <section class="page-content seguimiento-page">


            <!-- =============================================
                 HEADER EJECUTIVO
            ============================================== -->

            <header class="seguimiento-header">

                <div class="seguimiento-header-content">

                    <div class="seguimiento-header-icon">

                        <i class="fa-solid fa-chart-line"></i>

                    </div>


                    <div>

                        <span class="seguimiento-eyebrow">
                            Reclutamiento
                        </span>

                        <h1>
                            Seguimiento
                        </h1>

                        <p>
                            Monitoreo en tiempo real de los procesos
                            activos de reclutamiento.
                        </p>

                    </div>

                </div>


                <div class="seguimiento-header-status">

                    <span class="realtime-dot"></span>

                    Tiempo real

                </div>

            </header>


            <!-- =============================================
                 PANEL DE PROCESOS
            ============================================== -->

            <section class="seguimiento-panel">


                <!-- HEADER DEL PANEL -->

                <div class="seguimiento-panel-header">

                    <div>

                        <div class="seguimiento-panel-title">

                            <i class="fa-solid fa-list-check"></i>

                            <span>
                                Seguimiento de Procesos
                            </span>

                        </div>


                        <p>
                            Requisiciones actualmente en proceso
                        </p>

                    </div>


                    <span
                        id="contadorProcesos"
                        class="procesos-badge"
                    >
                        0 ACTIVOS
                    </span>

                </div>


                <!-- =========================================
                     CONTENEDOR
                ========================================== -->

                <div id="seguimientoContainer">

                    <div class="seguimiento-loading">

                        <div class="loading-spinner">

                            <i class="fa-solid fa-spinner fa-spin"></i>

                        </div>

                        <strong>
                            Cargando procesos
                        </strong>

                        <p>
                            Consultando información en tiempo real...
                        </p>

                    </div>

                </div>

            </section>


        </section>

    </main>

</div>


<!-- =========================================================
     SUPABASE
========================================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<!-- =========================================================
     SISTEMA
========================================================== -->

<script src="js/supabase-client.js"></script>

<script src="js/auth.js"></script>

<script src="js/sidebar.js"></script>

<script src="js/darkmode.js"></script>


<!-- =========================================================
     SEGUIMIENTO
========================================================== -->

<script src="js/seguimiento.js"></script>


</body>
</html>
